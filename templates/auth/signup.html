<!DOCTYPE html>
<html>
<head>
<title>Signup</title>
<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#141e30,#243b55);
font-family:Arial;
}
.container{
background:#111;
padding:40px;
border-radius:15px;
width:350px;
box-shadow:0 0 40px rgba(0,255,200,0.4);
color:white;
text-align:center;
}
input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}
button{
width:100%;
padding:12px;
background:#00ffc8;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}
a{color:#00ffc8;text-decoration:none;}
.error{color:red;}
</style>
</head>
<body>

<div class="container">
<h2>Create Account</h2>

{% for message in messages %}
<p class="error">{{ message }}</p>
{% endfor %}

<form method="POST">
{% csrf_token %}
<input type="text" name="username" placeholder="Username" required>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Sign Up</button>
</form>

<p>Already have account? <a href="/login/">Login</a></p>
</div>

</body>
</html>
