{% extends "base.html" %}

{% block title %}Profile{% endblock %}

{% block content %}

<style>
.profile-card{
    max-width:500px;
    margin:40px auto;
    background:#111;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 30px rgba(0,255,200,0.3);
}

.profile-card h2{
    text-align:center;
    margin-bottom:20px;
    color:#00ffc8;
}

.profile-info{
    margin-bottom:15px;
    padding:12px;
    background:#1a1a1a;
    border-radius:8px;
}

.profile-info span{
    color:#00ffc8;
    font-weight:bold;
}
</style>

<div class="profile-card">
    <h2>👤 User Profile</h2>

    <div class="profile-info">
        <span>Username:</span> {{ user.username }}
    </div>

    <div class="profile-info">
        <span>Email:</span> {{ user.email }}
    </div>

    <div class="profile-info">
        <span>Date Joined:</span> {{ user.date_joined }}
    </div>

    <div class="profile-info">
        <span>Last Login:</span> {{ user.last_login }}
    </div>

</div>

{% endblock %}
