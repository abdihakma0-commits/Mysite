{% load static %}
<section class="about-section">
    <div class="container">
        <h2 class="section-title">ABOUT <span class="gradient-text">ME</span></h2>

        <div class="about-grid">
            <!-- Left - Text Content -->
            <div class="about-text reveal">
                <div class="glass-card about-card">
                    <p class="about-description">
                        I'm a creative developer and designer based in Nairobi, 
                        passionate about building immersive digital experiences that 
                        push the boundaries of web technology.
                    </p>
                </div>

                <div class="stats-grid">
                    <div class="glass-card stat-card">
                        <div class="stat-number">5+</div>
                        <div class="stat-label">Years Experience</div>
                    </div>
                    <div class="glass-card stat-card">
                        <div class="stat-number">50+</div>
                        <div class="stat-label">Projects</div>
                    </div>
                    <div class="glass-card stat-card">
                        <div class="stat-number">20+</div>
                        <div class="stat-label">Clients</div>
                    </div>
                    <div class="glass-card stat-card">
                        <div class="stat-number">10+</div>
                        <div class="stat-label">Technologies</div>
                    </div>
                </div>
            </div>

            <!-- Right - 3D Avatar Placeholder -->
            <div class="about-3d reveal">
                <div id="avatar-3d-placeholder" class="avatar-3d-placeholder">
                    <!-- Three.js will render here -->
                </div>
            </div>
        </div>
    </div>
</section>
